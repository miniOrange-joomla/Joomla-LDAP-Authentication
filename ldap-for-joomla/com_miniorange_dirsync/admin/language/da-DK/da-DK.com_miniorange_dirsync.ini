COM_MINIORANGE_FAQ1="Hvad er et eksempel?"
COM_MINIORANGE_FAQ1_DETAILS="En Joomla -instans henviser til en enkelt installation af et Joomla -sted. Det henviser til hvert enkelt websted, hvor plugin er aktivt. I tilfælde af flere Joomla -websteder tælles hvert sted som en enkelt instans. For eksempel har du 3 steder, der er vært for udvikling, iscenesættelse og produktion. Dette tælles som 3 tilfælde."
COM_MINIORANGE_FAQ2="Tilbyder miniorange teknisk support?"
COM_MINIORANGE_FAQ2_DETAILS="Ja, vi leverer 24*7 support til alle problemer, du måtte stå over for, mens du bruger vores LDAP -godkendelsesplugin. Dette inkluderer teknisk support fra vores udviklere. Du kan få prioriteret support baseret på den supportplan, du har valgt."
COM_MINIORANGE_FAQ3="Opbevarer miniorange nogen brugerdata?"
COM_MINIORANGE_FAQ3_DETAILS="Miniorange gemmer eller overfører ikke nogen data, der kommer fra Active Directory/LDAP til Joomla. Alle data forbliver inden for dine lokaler/server."
COM_MINIORANGE_FAQ4="Tilbyder miniorange tilpasning?"
COM_MINIORANGE_FAQ4_DETAILS="Ja, miniorange leverer tilpasninger oven på vores premium plugins og tilføjelser. Vi har et team af dygtige udviklere, der kan tilpasse pluginet, så den passer til din brugssag og krav."
COM_MINIORANGE_FAQ5="Leverer miniorange udviklerlicens til betalte plugins?"
COM_MINIORANGE_FAQ5_DETAILS="Vi leverer ikke en udviklerlicens til vores betalte plugins, og kildekoden er beskyttet. Det er strengt forbudt at foretage ændringer i koden uden at have skrevet tilladelse fra miniorange."
COM_MINIORANGE_FAQ6="Hvad er refusionspolitikken?"
