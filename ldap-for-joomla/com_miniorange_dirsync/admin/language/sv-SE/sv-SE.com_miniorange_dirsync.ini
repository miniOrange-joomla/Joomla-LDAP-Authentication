COM_MINIORANGE_FAQ1="Vad är ett exempel?"
COM_MINIORANGE_FAQ1_DETAILS="En Joomla -instans hänvisar till en enda installation av en Joomla -webbplats. Den hänvisar till varje enskild webbplats där plugin är aktiv. När det gäller flera Joomla -webbplatser räknas varje webbplats som en enda instans. Till exempel har du tre platser som är värd för utveckling, iscensättning och produktion. Detta kommer att räknas som tre fall."
COM_MINIORANGE_FAQ2="Erbjuder Miniorange teknisk support?"
COM_MINIORANGE_FAQ2_DETAILS="Ja, vi ger 24*7 -stöd för alla problem du kan möta när du använder vår LDAP -autentiseringsplugin. Detta inkluderar teknisk support från våra utvecklare. Du kan få prioriterat stöd baserat på den supportplan du har valt."
COM_MINIORANGE_FAQ3="Lagrar miniorange någon användardata?"
COM_MINIORANGE_FAQ3_DETAILS="Miniorange lagrar eller överför inte data som kommer från Active Directory/LDAP till Joomla. All data kvarstår inom dina lokaler/server."
COM_MINIORANGE_FAQ4="Erbjuder miniorange anpassning?"
COM_MINIORANGE_FAQ4_DETAILS="Ja, miniorange tillhandahåller anpassningar ovanpå våra premiumplugins och tillägg. Vi har ett team av skickliga utvecklare som kan anpassa plugin för att passa ditt användningsfall och krav."
COM_MINIORANGE_FAQ5="Ger Miniorange utvecklarlicens för betalda plugins?"
COM_MINIORANGE_FAQ5_DETAILS="Vi tillhandahåller inte en utvecklarlicens för våra betalda plugins och källkoden är skyddad. Det är strängt förbjudet att göra några ändringar i koden utan att ha skriftligt tillstånd från miniorange."
COM_MINIORANGE_FAQ6="Vad är återbetalningspolicyn?"
