COM_MINIORANGE_FAQ1="Mi az a példány?"
COM_MINIORANGE_FAQ1_DETAILS="A Joomla példány a Joomla webhely egyetlen telepítésére utal. Minden egyes webhelyre utal, ahol a plugin aktív. Több Joomla webhely esetén az egyes webhelyeket egyetlen példánynak kell tekinteni. Például 3 webhelyet üzemeltet a fejlesztéshez, a színpadon és a termeléshez. Ezt 3 példánynak kell tekinteni."
COM_MINIORANGE_FAQ2="A Miniorange technikai támogatást kínál?"
COM_MINIORANGE_FAQ2_DETAILS="Igen, 24*7 támogatást nyújtunk minden olyan kérdéshez, amelyekkel az LDAP hitelesítési beépülő modulunk használata során felmerülhet. Ez magában foglalja fejlesztőink műszaki támogatását. A választott támogatási terv alapján prioritási támogatást kaphat."
COM_MINIORANGE_FAQ3="A Miniorange tárol -e valamilyen felhasználói adatot?"
COM_MINIORANGE_FAQ3_DETAILS="A Miniorange nem tárol vagy továbbít olyan adatot, amely az Active Directory/LDAP -ból származik a Joomla -nak. Az összes adat a helyiségekben/szerveren belül marad."
COM_MINIORANGE_FAQ4="A Miniorange testreszabást kínál?"
COM_MINIORANGE_FAQ4_DETAILS="Igen, a Miniorange testreszabást nyújt a prémium beépülő moduljainkon és kiegészítőinken. Van egy képzett fejlesztőcsoportunk, aki testreszabhatja a bővítményt az Ön használatához és követelményeinek megfelelően."
COM_MINIORANGE_FAQ5="Biztosítja -e a Miniorange fejlesztői engedélyt a fizetett beépülő modulokra?"
COM_MINIORANGE_FAQ5_DETAILS="Nem adunk fejlesztői licencet fizetett beépülő moduljainkhoz, és a forráskód védett. Szigorúan tilos, hogy bármilyen módosítson a kódban anélkül, hogy a Miniorange írásbeli engedélye lenne."
COM_MINIORANGE_FAQ6="Mi a visszatérítési politika?"
