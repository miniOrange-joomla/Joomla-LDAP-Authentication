COM_MINIORANGE_FAQ1="Qu'est-ce qu'une instance?"
COM_MINIORANGE_FAQ1_DETAILS="Une instance Joomla fait référence à une seule installation d'un site Joomla. Il fait référence à chaque site Web individuel où le plugin est actif. Dans le cas de plusieurs sites Joomla, chaque site sera compté comme une seule instance. Par exemple, vous avez 3 sites hébergés pour le développement, la mise en scène et la production. Cela sera compté comme 3 instances."
COM_MINIORANGE_FAQ2="Miniorange offre-t-il un support technique?"
COM_MINIORANGE_FAQ2_DETAILS="Oui, nous fournissons une prise en charge 24 * 7 pour tous les problèmes auxquels vous pourriez être confronté lors de l'utilisation de notre plugin d'authentification LDAP. Cela comprend le soutien technique de nos développeurs. Vous pouvez obtenir un support prioritaire en fonction du plan d'assistance pour lequel vous avez opté."
COM_MINIORANGE_FAQ3="Miniorange Store est-il des données utilisateur?"
COM_MINIORANGE_FAQ3_DETAILS="Miniorange ne stocke ni ne transfère des données qui proviennent de l'Active Directory / LDAP vers Joomla. Toutes les données restent dans vos locaux / serveur."
COM_MINIORANGE_FAQ4="Minorange offre-t-il une personnalisation?"
COM_MINIORANGE_FAQ4_DETAILS="Oui, Miniorange fournit des personnalisations en plus de nos plugins et compléments premium. Nous avons une équipe de développeurs qualifiés qui peuvent personnaliser le plugin en fonction de votre cas d'utilisation et de vos exigences."
COM_MINIORANGE_FAQ5="Miniorange fournit-il une licence de développeur pour les plugins payants?"
COM_MINIORANGE_FAQ5_DETAILS="Nous ne fournissons pas de licence de développeur pour nos plugins payants et le code source est protégé. Il est strictement interdit d'apporter des modifications dans le code sans avoir une autorisation écrite de Miniorange."
COM_MINIORANGE_FAQ6="Quelle est la politique de remboursement?"
