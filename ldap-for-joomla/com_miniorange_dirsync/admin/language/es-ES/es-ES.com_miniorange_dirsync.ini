COM_MINIORANGE_FAQ1="¿Qué es una instancia?"
COM_MINIORANGE_FAQ1_DETAILS="Una instancia de Joomla se refiere a una sola instalación de un sitio de Joomla. Se refiere a cada sitio web individual donde el complemento está activo. En el caso de múltiples sitios de Joomla, cada sitio se contará como una sola instancia. Por ejemplo, tiene 3 sitios alojados para el desarrollo, la puesta en escena y la producción. Esto se contará como 3 instancias."
COM_MINIORANGE_FAQ2="¿Miniorange ofrece soporte técnico?"
COM_MINIORANGE_FAQ2_DETAILS="Sí, proporcionamos soporte 24*7 para todos y cada uno de los problemas que puede enfrentar mientras usa nuestro complemento de autenticación LDAP. Esto incluye soporte técnico de nuestros desarrolladores. Puede obtener el soporte prioritario basado en el plan de soporte que ha optado."
COM_MINIORANGE_FAQ3="¿Miniorange almacena los datos del usuario?"
COM_MINIORANGE_FAQ3_DETAILS="Miniorange no almacena ni transfiere ningún dato que provenga del Active Directory/LDAP a Joomla. Todos los datos permanecen dentro de sus instalaciones/servidor."
COM_MINIORANGE_FAQ4="¿Miniorange ofrece personalización?"
COM_MINIORANGE_FAQ4_DETAILS="Sí, Miniorange proporciona personalizaciones además de nuestros complementos y complementos premium. Tenemos un equipo de desarrolladores calificados que pueden personalizar el complemento para adaptarse a su caso de uso y requisitos."
COM_MINIORANGE_FAQ5="¿Miniorange proporciona licencia de desarrollador para complementos pagados?"
COM_MINIORANGE_FAQ5_DETAILS="No proporcionamos una licencia de desarrollador para nuestros complementos pagados y el código fuente está protegido. Está estrictamente prohibido realizar cualquier cambio en el código sin tener un permiso por escrito de Miniorange."
COM_MINIORANGE_FAQ6="¿Cuál es la política de reembolso?"
