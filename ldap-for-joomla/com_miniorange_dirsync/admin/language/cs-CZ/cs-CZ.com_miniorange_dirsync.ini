COM_MINIORANGE_FAQ1="Co je instance?"
COM_MINIORANGE_FAQ1_DETAILS="Instance Joomla odkazuje na jednu instalaci webu Joomla. Odkazuje na každý jednotlivý web, kde je plugin aktivní. V případě více stránek Joomla bude každý web započítán jako jediná instance. Například máte 3 weby hostované pro vývoj, inscenaci a výrobu. To se bude počítat jako 3 instance."
COM_MINIORANGE_FAQ2="Nabízí Miniorange technickou podporu?"
COM_MINIORANGE_FAQ2_DETAILS="Ano, poskytujeme 24*7 podporu pro všechny problémy, kterým můžete čelit při používání našeho pluginu LDAP ověřování. To zahrnuje technickou podporu našich vývojářů. Na základě plánu podpory, který jste se rozhodli, můžete získat upřednostňovanou podporu."
COM_MINIORANGE_FAQ3="Ukládá Miniorange některá uživatelská data?"
COM_MINIORANGE_FAQ3_DETAILS="Miniorange neukládá ani nepřenáší žádná data, která pocházejí z Active Directory/LDAP do Joomly. Všechna data zůstávají ve vašich prostorách/serveru."
COM_MINIORANGE_FAQ4="Nabízí Miniorange přizpůsobení?"
COM_MINIORANGE_FAQ4_DETAILS="Ano, Miniorange poskytuje přizpůsobení na vrcholu našich prémiových pluginů a doplňků. Máme tým kvalifikovaných vývojářů, kteří si mohou přizpůsobit plugin tak, aby vyhovoval vašemu pouzdru a požadavkům použití."
COM_MINIORANGE_FAQ5="Poskytuje Miniorange licenci pro placené pluginy?"
COM_MINIORANGE_FAQ5_DETAILS="Neposkytujeme vývojářskou licenci pro naše placené pluginy a zdrojový kód je chráněn. Je přísně zakázáno provádět jakékoli změny v kódu, aniž by měl písemné povolení Miniorange."
COM_MINIORANGE_FAQ6="Jaká je politika vrácení peněz?"
