COM_MINIORANGE_FAQ1="O que é uma instância?"
COM_MINIORANGE_FAQ1_DETAILS="Uma instância do Joomla refere -se a uma única instalação de um site Joomla. Refere -se a cada site individual em que o plug -in está ativo. No caso de vários sites Joomla, cada site será contado como uma única instância. Por exemplo, você tem 3 sites hospedados para desenvolvimento, estadiamento e produção. Isso será contado como 3 instâncias."
COM_MINIORANGE_FAQ2="O Miniorange oferece suporte técnico?"
COM_MINIORANGE_FAQ2_DETAILS="Sim, fornecemos suporte 24*7 para todos e quaisquer problemas que você possa enfrentar ao usar nosso plug -in de autenticação LDAP. Isso inclui suporte técnico de nossos desenvolvedores. Você pode obter suporte priorizado com base no plano de suporte pelo qual optou."
COM_MINIORANGE_FAQ3="O Miniorange armazena algum dados do usuário?"
COM_MINIORANGE_FAQ3_DETAILS="O Miniorange não armazena ou transfere nenhum dado proveniente do Active Directory/LDAP para o Joomla. Todos os dados permanecem dentro de suas instalações/servidor."
COM_MINIORANGE_FAQ4="O Miniorange oferece personalização?"
COM_MINIORANGE_FAQ4_DETAILS="Sim, o Miniorange fornece personalizações sobre nossos plugins e complementos premium. Temos uma equipe de desenvolvedores qualificados que podem personalizar o plug -in para atender ao seu caso de uso e requisitos."
COM_MINIORANGE_FAQ5="A Miniorange fornece licença de desenvolvedor para plugins pagos?"
COM_MINIORANGE_FAQ5_DETAILS="Não fornecemos uma licença de desenvolvedor para nossos plug -ins pagos e o código -fonte está protegido. É estritamente proibido fazer alterações no código sem ter permissão por escrito da Miniorange."
COM_MINIORANGE_FAQ6="Qual é a política de reembolso?"
