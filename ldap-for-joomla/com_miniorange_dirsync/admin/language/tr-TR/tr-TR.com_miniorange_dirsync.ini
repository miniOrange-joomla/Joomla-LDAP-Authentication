COM_MINIORANGE_FAQ1="Bir örnek nedir?"
COM_MINIORANGE_FAQ1_DETAILS="Bir Joomla örneği, bir Joomla sitesinin tek bir kurulumunu ifade eder. Eklentinin etkin olduğu her bir web sitesini ifade eder. Birden fazla Joomla sitesi durumunda, her site tek bir örnek olarak sayılır. Örneğin, geliştirme, evreleme ve üretim için barındırılmış 3 siteniz var. Bu 3 örnek olarak sayılacaktır."
COM_MINIORANGE_FAQ2="Miniorange teknik destek sunuyor mu?"
COM_MINIORANGE_FAQ2_DETAILS="Evet, LDAP kimlik doğrulama eklentimizi kullanırken karşılaşabileceğiniz tüm sorunlar için 24*7 destek sağlıyoruz. Bu, geliştiricilerimizin teknik desteğini içerir. Seçtiğiniz destek planına göre önceliklendirilmiş destek alabilirsiniz."
COM_MINIORANGE_FAQ3="Miniorange herhangi bir kullanıcı verisini depolar mı?"
COM_MINIORANGE_FAQ3_DETAILS="Miniorange, Active Directory/LDAP'dan Joomla'ya gelen herhangi bir veriyi depolamaz veya aktarmaz. Tüm veriler tesisinizde/sunucunuzda kalır."
COM_MINIORANGE_FAQ4="Miniorange özelleştirme sunuyor mu?"
COM_MINIORANGE_FAQ4_DETAILS="Evet, Miniorange premium eklentilerimizin ve eklentilerimizin üstünde özelleştirmeler sağlar. Eklentiyi kullanım durumunuza ve gereksinimlerinize uyacak şekilde özelleştirebilen yetenekli geliştiricilerden oluşan bir ekibimiz var."
COM_MINIORANGE_FAQ5="Miniorange, ücretli eklentiler için geliştirici lisansı sağlıyor mu?"
COM_MINIORANGE_FAQ5_DETAILS="Ücretli eklentilerimiz için bir geliştirici lisansı vermiyoruz ve kaynak kodu korunuyor. Miniorange'dan yazılı izin almadan kodda herhangi bir değişiklik yapmak kesinlikle yasaktır."
COM_MINIORANGE_FAQ6="Geri ödeme politikası nedir?"
